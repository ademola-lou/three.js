<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - probe grid (SSGI scene)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Probe Grid (SSGI Scene)</span>
			</div>

			<small>
				Probe grid interpolation tested on the Cornell-style SSGI scene setup.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { texture3D, uniform, pass, mrt, output, normalView, diffuseColor, velocity, add, vec3, vec4, directionToColor, colorToDirection, sample, Fn } from 'three/tsl';
			import { ssgi } from 'three/addons/tsl/display/SSGINode.js';
			import { traa } from 'three/addons/tsl/display/TRAANode.js';

			import { Inspector } from 'three/addons/inspector/Inspector.js';
			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { LightProbeHelper } from 'three/addons/helpers/LightProbeHelperGPU.js';
			import { ProbeGrid } from 'three/addons/lights/ProbeGrid.js';

			let renderer, scene, camera;
			let controls;
			let probeGrid;
			let sampledProbe;
			let movingMesh;
			let probeBoundsNodeMin;
			let probeBoundsNodeSize;
			let probeColorTexture;
			let renderPipeline;
			let postProcessOutputType = 0;
			let scenePassColorNode;
			let compositePassNode;
			let giNode;
			let aoNode;
			let giPassNode;
			let traaPassNode;

			const probeHelpers = [];
			const clock = new THREE.Clock();
			const samplePoint = new THREE.Vector3();
			const sampleNormal = new THREE.Vector3();
			const sampleViewDirection = new THREE.Vector3();

			const GRID_DIVISIONS = new THREE.Vector3( 6, 5, 6 );

			const API = {
				animate: true,
				speed: 0.25,
				showProbeHelpers: true,
				useGeometricWeighting: true,
				geometricPower: 2,
				normalBias: 0.25,
				viewBias: 0.15
			};

			init();

			function init() {

				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 10, 30 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0xaaaaaa );

				// Keep sample count aligned with post-processing depth pipeline.
				renderer = new THREE.WebGPURenderer();
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.inspector = new Inspector();
				document.body.appendChild( renderer.domElement );

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 7, 0 );
				controls.enablePan = true;
				controls.minDistance = 1;
				controls.maxDistance = 100;
				controls.update();

				buildSceneGeometry();
				buildProbeGrid();
				setupPostProcessing();

				window.addEventListener( 'resize', onWindowResize );

				const gui = renderer.inspector.createParameters( 'Probe Grid' );
				gui.add( API, 'animate' );
				gui.add( API, 'speed', 0.05, 1, 0.01 );
				gui.add( API, 'showProbeHelpers' ).onChange( () => {

					for ( let i = 0; i < probeHelpers.length; i ++ ) {

						probeHelpers[ i ].visible = API.showProbeHelpers;

					}

				} );
				gui.add( API, 'useGeometricWeighting' );
				gui.add( API, 'geometricPower', 0.5, 8, 0.5 );
				gui.add( API, 'normalBias', 0, 1, 0.01 );
				gui.add( API, 'viewBias', 0, 1, 0.01 );

			}

			function setupPostProcessing() {

				renderPipeline = new THREE.RenderPipeline( renderer );

				const scenePass = pass( scene, camera );
				scenePass.setMRT( mrt( {
					output: output,
					diffuseColor: diffuseColor,
					normal: directionToColor( normalView ),
					velocity: velocity
				} ) );

				scenePassColorNode = scenePass.getTextureNode( 'output' );
				const scenePassDiffuseNode = scenePass.getTextureNode( 'diffuseColor' ).toInspector( 'Diffuse Color' );
				const scenePassDepthNode = scenePass.getTextureNode( 'depth' ).toInspector( 'Depth', () => scenePass.getLinearDepthNode() );
				const scenePassNormalNode = scenePass.getTextureNode( 'normal' ).toInspector( 'Normal' );
				const scenePassVelocityNode = scenePass.getTextureNode( 'velocity' ).toInspector( 'Velocity' );

				// bandwidth optimization
				scenePass.getTexture( 'diffuseColor' ).type = THREE.UnsignedByteType;
				scenePass.getTexture( 'normal' ).type = THREE.UnsignedByteType;

				const sceneNormal = sample( ( uv ) => colorToDirection( scenePassNormalNode.sample( uv ) ) );

				giPassNode = ssgi( scenePassColorNode, scenePassDepthNode, sceneNormal, camera );
				giPassNode.sliceCount.value = 2;
				giPassNode.stepCount.value = 8;
				giPassNode.useTemporalFiltering = false;

				giPassNode.fallbackFn = Fn( ( [ worldPos ] ) => {

					const probeUV = worldPos.sub( probeBoundsNodeMin ).div( probeBoundsNodeSize ).clamp( 0, 1 );
					return texture3D( probeColorTexture, probeUV ).rgb.mul( 0.2 );

				} );
				giPassNode.fallbackIntensity.value = 0.6;
				giPassNode.fallbackBlendPower.value = 2.0;

				giNode = giPassNode.rgb.toInspector( 'SSGI' );
				aoNode = giPassNode.a.toInspector( 'AO' );

				// Keep direct lighting untouched; add GI on top.
				compositePassNode = vec4( add( scenePassColorNode.rgb, scenePassDiffuseNode.rgb.mul( giNode.max( 0 ) ) ), scenePassColorNode.a );
				compositePassNode.name = 'Composite';

				traaPassNode = traa( compositePassNode, scenePassDepthNode, scenePassVelocityNode, camera );

				updatePostprocessing();

				const ssgiGui = renderer.inspector.createParameters( 'SSGI settings' );
				const outputTypes = { Combined: 0, Direct: 3, AO: 1, GI: 2 };
				ssgiGui.add( { output: postProcessOutputType }, 'output', outputTypes ).onChange( ( value ) => {

					postProcessOutputType = value;
					updatePostprocessing();

				} );
				ssgiGui.add( giPassNode.sliceCount, 'value', 1, 4, 1 ).name( 'slice count' );
				ssgiGui.add( giPassNode.stepCount, 'value', 1, 32, 1 ).name( 'step count' );
				ssgiGui.add( giPassNode.radius, 'value', 1, 25 ).name( 'radius' );
				ssgiGui.add( giPassNode.expFactor, 'value', 1, 3 ).name( 'exp factor' );
				ssgiGui.add( giPassNode.thickness, 'value', 0.01, 10 ).name( 'thickness' );
				ssgiGui.add( giPassNode.backfaceLighting, 'value', 0, 1 ).name( 'backface lighting' );
				ssgiGui.add( giPassNode.aoIntensity, 'value', 0, 4 ).name( 'AO intensity' );
				ssgiGui.add( giPassNode.giIntensity, 'value', 0, 100 ).name( 'GI intensity' );
				ssgiGui.add( giPassNode.useLinearThickness, 'value' ).name( 'use linear thickness' );
				ssgiGui.add( giPassNode.useScreenSpaceSampling, 'value' ).name( 'screen-space sampling' );
				ssgiGui.add( giPassNode, 'useTemporalFiltering' ).name( 'temporal filtering' ).onChange( updatePostprocessing );
				ssgiGui.add( giPassNode.fallbackIntensity, 'value', 0, 10 ).name( 'probe fallback' );
				ssgiGui.add( giPassNode.fallbackBlendPower, 'value', 1, 4 ).name( 'fallback blend' );

			}

			function updatePostprocessing() {

				if ( ! renderPipeline ) return;

				if ( postProcessOutputType === 1 ) {

					renderPipeline.outputNode = vec4( vec3( aoNode ), 1 );

				} else if ( postProcessOutputType === 2 ) {

					renderPipeline.outputNode = vec4( giNode, 1 );

				} else if ( postProcessOutputType === 3 ) {

					renderPipeline.outputNode = scenePassColorNode;

				} else {

					renderPipeline.outputNode = giPassNode.useTemporalFiltering ? traaPassNode : compositePassNode;

				}

				renderPipeline.needsUpdate = true;

			}

			function buildSceneGeometry() {

				const wallGeometry = new THREE.PlaneGeometry( 1, 1 );

				const redWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#ff0000' } );
				const leftWall = new THREE.Mesh( wallGeometry, redWallMaterial );
				leftWall.scale.set( 20, 15, 1 );
				leftWall.rotation.y = Math.PI * 0.5;
				leftWall.position.set( - 10, 7.5, 0 );
				leftWall.receiveShadow = true;
				scene.add( leftWall );

				const greenWallMaterial = new THREE.MeshPhysicalMaterial( { color: '#00ff00' } );
				const rightWall = new THREE.Mesh( wallGeometry, greenWallMaterial );
				rightWall.scale.set( 20, 15, 1 );
				rightWall.rotation.y = Math.PI * - 0.5;
				rightWall.position.set( 10, 7.5, 0 );
				rightWall.receiveShadow = true;
				scene.add( rightWall );

				const whiteMaterial = new THREE.MeshPhysicalMaterial( { color: '#ffffff' } );

				const floor = new THREE.Mesh( wallGeometry, whiteMaterial );
				floor.scale.set( 20, 20, 1 );
				floor.rotation.x = Math.PI * - 0.5;
				floor.receiveShadow = true;
				scene.add( floor );

				const backWall = new THREE.Mesh( wallGeometry, whiteMaterial );
				backWall.scale.set( 15, 20, 1 );
				backWall.rotation.z = Math.PI * - 0.5;
				backWall.position.set( 0, 7.5, - 10 );
				backWall.receiveShadow = true;
				scene.add( backWall );

				const ceiling = new THREE.Mesh( wallGeometry, whiteMaterial );
				ceiling.scale.set( 20, 20, 1 );
				ceiling.rotation.x = Math.PI * 0.5;
				ceiling.position.set( 0, 15, 0 );
				ceiling.receiveShadow = true;
				scene.add( ceiling );

				const tallBoxGeometry = new THREE.BoxGeometry( 5, 7, 5 );
				const tallBox = new THREE.Mesh( tallBoxGeometry, whiteMaterial );
				tallBox.rotation.y = Math.PI * 0.25;
				tallBox.position.set( - 3, 3.5, - 2 );
				tallBox.castShadow = true;
				tallBox.receiveShadow = true;
				scene.add( tallBox );

				const shortBoxGeometry = new THREE.BoxGeometry( 4, 4, 4 );
				const shortBox = new THREE.Mesh( shortBoxGeometry, whiteMaterial );
				shortBox.rotation.y = Math.PI * - 0.1;
				shortBox.position.set( 4, 2, 4 );
				shortBox.castShadow = true;
				shortBox.receiveShadow = true;
				scene.add( shortBox );

				const pointLight = new THREE.PointLight( '#ffffff', 100 );
				pointLight.position.set( 0, 13, 0 );
				pointLight.distance = 100;
				pointLight.castShadow = true;
				pointLight.shadow.mapSize.width = 1024;
				pointLight.shadow.mapSize.height = 1024;
				scene.add( pointLight );

				const ambientLight = new THREE.AmbientLight( '#0c0c0c' );
				scene.add( ambientLight );

				// Moving test object lit by sampled probe.
				movingMesh = new THREE.Mesh(
					new THREE.SphereGeometry( 1, 48, 24 ),
					new THREE.MeshStandardMaterial( {
						color: 0xffffff,
						roughness: 0.35,
						metalness: 0.05
					} )
				);
				movingMesh.castShadow = true;
				movingMesh.position.set( 0, 1.2, 0 );
				scene.add( movingMesh );

			}

			function buildProbeGrid() {

				const bounds = new THREE.Box3(
					new THREE.Vector3( - 9, 1, - 9 ),
					new THREE.Vector3( 9, 14, 9 )
				);

				probeGrid = new ProbeGrid( bounds, GRID_DIVISIONS );
				populateProbeGrid( probeGrid );

				probeBoundsNodeMin = uniform( bounds.min.clone() );
				probeBoundsNodeSize = uniform( bounds.getSize( new THREE.Vector3() ) );
				probeColorTexture = createProbeColorTexture( probeGrid );

				// Helpers are intentionally skipped in the MRT scene pass to avoid G-buffer incompatibilities.

				sampledProbe = new THREE.LightProbe();
				scene.add( sampledProbe );

				updateSampledProbe();

			}

			function populateProbeGrid( grid ) {

				const leftColor = new THREE.Color( 1, 0.05, 0.05 );
				const rightColor = new THREE.Color( 0.05, 1, 0.05 );
				const whiteBounce = new THREE.Color( 1, 1, 1 );
				const sideColor = new THREE.Color();
				const finalColor = new THREE.Color();

				const sx = grid.divisions.x;
				const sy = grid.divisions.y;

				grid.forEachProbe( ( probe, position, _index, x, y ) => {

					probe.position.copy( position );

					const nx = sx === 1 ? 0.5 : x / ( sx - 1 );
					const ny = sy === 1 ? 0.5 : y / ( sy - 1 );

					sideColor.copy( leftColor ).lerp( rightColor, nx );

					// Blend in white bounce from floor/ceiling and boost upper probes slightly.
					finalColor.copy( sideColor ).lerp( whiteBounce, 0.3 + 0.25 * Math.abs( ny - 0.5 ) );
					finalColor.multiplyScalar( THREE.MathUtils.lerp( 0.7, 1.2, ny ) );

					applyConstantIrradiance( probe, finalColor );

				} );

			}

			function applyConstantIrradiance( probe, color ) {

				for ( let i = 0; i < 9; i ++ ) {

					probe.sh.coefficients[ i ].set( 0, 0, 0 );

				}

				probe.sh.coefficients[ 0 ].set( color.r, color.g, color.b ).multiplyScalar( 0.9 );
				probe.intensity = 1;

			}

			function createProbeColorTexture( grid ) {

				const sx = grid.divisions.x;
				const sy = grid.divisions.y;
				const sz = grid.divisions.z;
				const data = new Float32Array( sx * sy * sz * 4 );

				let texelOffset = 0;

				grid.forEachProbe( ( probe ) => {

					const c = probe.sh.coefficients[ 0 ];
					data[ texelOffset + 0 ] = c.x;
					data[ texelOffset + 1 ] = c.y;
					data[ texelOffset + 2 ] = c.z;
					data[ texelOffset + 3 ] = 1;
					texelOffset += 4;

				} );

				const texture = new THREE.Data3DTexture( data, sx, sy, sz );
				texture.type = THREE.FloatType;
				texture.format = THREE.RGBAFormat;
				texture.minFilter = THREE.LinearFilter;
				texture.magFilter = THREE.LinearFilter;
				texture.wrapS = THREE.ClampToEdgeWrapping;
				texture.wrapT = THREE.ClampToEdgeWrapping;
				texture.wrapR = THREE.ClampToEdgeWrapping;
				texture.generateMipmaps = false;
				texture.needsUpdate = true;

				return texture;

			}

			function updateSampledProbe() {

				sampleNormal.subVectors( camera.position, movingMesh.position ).normalize();
				samplePoint.copy( movingMesh.position ).addScaledVector( sampleNormal, 1.0 );
				sampleViewDirection.subVectors( camera.position, samplePoint ).normalize();

				probeGrid.sample( samplePoint, sampledProbe, {
					normal: sampleNormal,
					viewDirection: sampleViewDirection,
					normalBias: API.normalBias,
					viewBias: API.viewBias,
					geometricWeighting: API.useGeometricWeighting,
					geometricPower: API.geometricPower
				} );

			}

			function onWindowResize() {

				const width = window.innerWidth;
				const height = window.innerHeight;

				camera.aspect = width / height;
				camera.updateProjectionMatrix();
				renderer.setSize( width, height );

			}

			function animate() {

				controls.update();

				if ( API.animate === true ) {

					const t = clock.getElapsedTime() * API.speed;
					movingMesh.position.x = Math.sin( t * 0.8 ) * 6;
					movingMesh.position.y = 1.1 + Math.sin( t * 1.9 ) * 0.4;
					movingMesh.position.z = Math.cos( t * 0.6 ) * 6;

				}

				updateSampledProbe();
				renderPipeline.render();

			}

		</script>

	</body>
</html>
