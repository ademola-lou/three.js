<!DOCTYPE html>
<html lang="en">
	<head>
		<title>three.js webgpu - light probe volume (multi-room)</title>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
		<link type="text/css" rel="stylesheet" href="example.css">
	</head>
	<body>

		<div id="info">
			<a href="https://threejs.org/" target="_blank" rel="noopener" class="logo-link"></a>

			<div class="title-wrapper">
				<a href="https://threejs.org/" target="_blank" rel="noopener">three.js</a><span>Light Probe Volume (Multi-Room)</span>
			</div>

			<small>
				Two rooms with independent light probe volumes in WebGPU. Bake time scales with probe resolution.
				GLB upload: use <strong>GLTF → Load</strong> (self-contained <code>.glb</code> recommended; separate <code>.gltf</code> + <code>.bin</code> often will not load from disk). Rebake or change resolution to refresh GI.
			</small>
		</div>

		<script type="importmap">
			{
				"imports": {
					"three": "../build/three.webgpu.js",
					"three/webgpu": "../build/three.webgpu.js",
					"three/tsl": "../build/three.tsl.js",
					"three/addons/": "./jsm/"
				}
			}
		</script>

		<script type="module">

			import * as THREE from 'three/webgpu';
			import { lights } from 'three/tsl';

			import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
			import { TransformControls } from 'three/addons/controls/TransformControls.js';
			import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
			import { LightProbeGridGPU } from 'three/addons/lighting/LightProbeGridGPU.js';
			import { LightProbeGridNode } from 'three/addons/lighting/LightProbeGridNode.js';
			import { LightProbeGridHelper } from 'three/addons/helpers/LightProbeGridHelperGPU.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

			let camera, scene, renderer, controls, transformControls;
			let probesLeft, probesRight;
			let probesHelperLeft, probesHelperRight;
			let gui;
			let uploadedModel = null;
			const uploadedModelMaterials = [];

			const probeMaterials = [];

			const params = {
				enabled: true,
				showProbes: false,
				resolution: 4
			};

			init();

			async function init() {

				camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.1, 100 );
				camera.position.set( 0, 2.5, 16 );

				scene = new THREE.Scene();
				scene.background = new THREE.Color( 0x111111 );

				const warmLight = new THREE.PointLight( 0xffaa44, 30 );
				warmLight.position.set( - 4, 4.5, 0 );
				warmLight.castShadow = true;
				warmLight.shadow.mapSize.setScalar( 256 );
				warmLight.shadow.radius = 12;
				warmLight.shadow.bias = - 0.002;
				scene.add( warmLight );

				const coolLight = new THREE.PointLight( 0x88bbff, 30 );
				coolLight.position.set( 4, 4.5, 0 );
				coolLight.castShadow = true;
				coolLight.shadow.mapSize.setScalar( 256 );
				coolLight.shadow.radius = 12;
				coolLight.shadow.bias = - 0.002;
				scene.add( coolLight );

				const lightSources = [ warmLight, coolLight ];

				const createMaterial = ( parameters ) => {

					const material = new THREE.MeshStandardNodeMaterial( parameters );
					probeMaterials.push( material );
					return material;

				};

				const wallMaterial = createMaterial( { color: 0xcccccc, side: THREE.BackSide } );
				const whiteMat = createMaterial( { color: 0xeeeeee } );
				const dividerMat = createMaterial( { color: 0xcccccc } );
				const redMat = createMaterial( { color: 0xdd2200 } );
				const blueMat = createMaterial( { color: new THREE.Color("blue").multiplyScalar(5) } );
				const woodMat = createMaterial( { color: 0x886644 } );
				const goldMat = createMaterial( { color: 0xffd700, metalness: 0.3, roughness: 0.4 } );
				const pinkMat = createMaterial( { color: 0xff44aa, metalness: 0.2, roughness: 0.5 } );

				const room = new THREE.Mesh( new THREE.BoxGeometry( 16, 5, 8 ), wallMaterial );
				room.position.set( 0, 2.5, 0 );
				room.receiveShadow = true;
				scene.add( room );

				const redWall = new THREE.Mesh( new THREE.PlaneGeometry( 8, 5 ), redMat );
				redWall.rotation.y = Math.PI / 2;
				redWall.position.set( - 7.99, 2.5, 0 );
				scene.add( redWall );

				const blueWall = new THREE.Mesh( new THREE.PlaneGeometry( 8, 5 ), blueMat );
				blueWall.rotation.y = - Math.PI / 2;
				blueWall.position.set( 7.99, 2.5, 0 );
				scene.add( blueWall );

				const doorwayHalfGap = 1.25;

				const dividerLeft = new THREE.Mesh( new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ), dividerMat );
				dividerLeft.position.set( 0, 2.5, - ( doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 ) );
				dividerLeft.castShadow = true;
				dividerLeft.receiveShadow = true;
				scene.add( dividerLeft );

				const dividerRight = new THREE.Mesh( new THREE.BoxGeometry( 0.3, 5, 4 - doorwayHalfGap ), dividerMat );
				dividerRight.position.set( 0, 2.5, doorwayHalfGap + ( 4 - doorwayHalfGap ) / 2 );
				dividerRight.castShadow = true;
				dividerRight.receiveShadow = true;
				scene.add( dividerRight );

				const lintel = new THREE.Mesh( new THREE.BoxGeometry( 0.3, 1.2, doorwayHalfGap * 2 ), dividerMat );
				lintel.position.set( 0, 4.4, 0 );
				lintel.castShadow = true;
				lintel.receiveShadow = true;
				scene.add( lintel );

				const columnGeom = new THREE.CylinderGeometry( 0.3, 0.3, 4, 16 );

				for ( const x of [ - 6, - 2 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				const tableTop = new THREE.Mesh( new THREE.BoxGeometry( 2.4, 0.12, 1.4 ), woodMat );
				tableTop.position.set( - 4, 1.0, 0 );
				tableTop.castShadow = true;
				tableTop.receiveShadow = true;
				scene.add( tableTop );

				const legGeom = new THREE.BoxGeometry( 0.1, 1, 0.1 );

				for ( const x of [ - 5.05, - 2.95 ] ) {

					for ( const z of [ - 0.55, 0.55 ] ) {

						const leg = new THREE.Mesh( legGeom, woodMat );
						leg.position.set( x, 0.5, z );
						leg.castShadow = true;
						scene.add( leg );

					}

				}

				const sphere = new THREE.Mesh( new THREE.SphereGeometry( 0.35, 32, 32 ), goldMat );
				sphere.position.set( - 4, 1.41, 0 );
				sphere.castShadow = true;
				sphere.receiveShadow = true;
				scene.add( sphere );

				const step1 = new THREE.Mesh( new THREE.BoxGeometry( 1.5, 0.5, 1 ), whiteMat );
				step1.position.set( - 7, 0.25, 0 );
				step1.castShadow = true;
				step1.receiveShadow = true;
				scene.add( step1 );

				const step2 = new THREE.Mesh( new THREE.BoxGeometry( 1.0, 1.0, 1 ), whiteMat );
				step2.position.set( - 7, 0.5, 0 );
				step2.castShadow = true;
				step2.receiveShadow = true;
				scene.add( step2 );

				const step3 = new THREE.Mesh( new THREE.BoxGeometry( 0.5, 1.5, 1 ), whiteMat );
				step3.position.set( - 7, 0.75, 0 );
				step3.castShadow = true;
				step3.receiveShadow = true;
				scene.add( step3 );

				for ( const x of [ 2, 6 ] ) {

					for ( const z of [ - 2.5, 2.5 ] ) {

						const col = new THREE.Mesh( columnGeom, whiteMat );
						col.position.set( x, 2, z );
						col.castShadow = true;
						col.receiveShadow = true;
						scene.add( col );

					}

				}

				const pedestal = new THREE.Mesh( new THREE.BoxGeometry( 0.8, 1.2, 0.8 ), whiteMat );
				pedestal.position.set( 4, 0.6, 0 );
				pedestal.castShadow = true;
				pedestal.receiveShadow = true;
				scene.add( pedestal );

				const torusKnot = new THREE.Mesh( new THREE.TorusKnotGeometry( 0.3, 0.1, 64, 16 ), pinkMat );
				torusKnot.position.set( 4, 1.65, 0 );
				torusKnot.castShadow = true;
				torusKnot.receiveShadow = true;
				scene.add( torusKnot );

				const sculpture = new THREE.Mesh( new THREE.ConeGeometry( 0.4, 2.5, 5 ), whiteMat );
				sculpture.position.set( 6.5, 1.25, - 1.5 );
				sculpture.castShadow = true;
				sculpture.receiveShadow = true;
				scene.add( sculpture );

				renderer = new THREE.WebGPURenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.shadowMap.enabled = true;
				renderer.toneMapping = THREE.ACESFilmicToneMapping;
				renderer.toneMappingExposure = 1.0;
				document.body.appendChild( renderer.domElement );

				await renderer.init();

				controls = new OrbitControls( camera, renderer.domElement );
				controls.target.set( 0, 2.5, 0 );
				controls.update();

				transformControls = new TransformControls( camera, renderer.domElement );
				transformControls.addEventListener( 'dragging-changed', ( event ) => {

					controls.enabled = ! event.value;

				} );
				transformControls.attach( sphere );
				scene.add( transformControls.getHelper() );

				function updateLightsNode() {

					const activeLights = [ ...lightSources ];

					if ( params.enabled && probesLeft && probesRight ) {

						activeLights.push( new LightProbeGridNode( probesLeft ), new LightProbeGridNode( probesRight ) );

					}

					const lightsNode = lights( activeLights );

					for ( const material of probeMaterials ) {

						material.lightsNode = lightsNode;
						material.needsUpdate = true;

					}

				}

				async function bakeWithResolution( resolution ) {

					const startTime = performance.now();
					console.log( `LightProbeGridGPU: baking ${ resolution }x${ resolution }x${ resolution } probe volumes...` );

					if ( probesHelperLeft ) {

						probesHelperLeft.visible = false;

					}

					if ( probesHelperRight ) {

						probesHelperRight.visible = false;

					}

					if ( probesLeft ) {

						probesLeft.dispose();
						probesLeft = null;

					}

					if ( probesRight ) {

						probesRight.dispose();
						probesRight = null;

					}

					updateLightsNode();

					probesLeft = new LightProbeGridGPU( 7.8, 4.7, 7.6, resolution, resolution, resolution );
					probesLeft.position.set( - 3.9, 2.45, 0 );
					await probesLeft.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20 } );

					probesRight = new LightProbeGridGPU( 7.8, 4.7, 7.6, resolution, resolution, resolution );
					probesRight.position.set( 3.9, 2.45, 0 );
					await probesRight.bake( renderer, scene, { cubemapSize: 32, near: 0.05, far: 20 } );

					updateLightsNode();

					if ( probesHelperLeft === undefined || probesHelperLeft === null ) {

						probesHelperLeft = new LightProbeGridHelper( probesLeft );
						scene.add( probesHelperLeft );

					} else {

						probesHelperLeft.probes = probesLeft;
						probesHelperLeft.update();

					}

					probesHelperLeft.visible = params.showProbes;

					if ( probesHelperRight === undefined || probesHelperRight === null ) {

						probesHelperRight = new LightProbeGridHelper( probesRight );
						scene.add( probesHelperRight );

					} else {

						probesHelperRight.probes = probesRight;
						probesHelperRight.update();

					}

					probesHelperRight.visible = params.showProbes;

					renderer.setSize( window.innerWidth, window.innerHeight, false );
					renderer.render( scene, camera );

					console.log( `LightProbeGridGPU: bake complete in ${ ( performance.now() - startTime ).toFixed( 1 ) } ms.` );

				}

				const gltfLoader = new GLTFLoader();

				function registerUploadedMaterial( material ) {

					if ( ! probeMaterials.includes( material ) ) {

						probeMaterials.push( material );
						uploadedModelMaterials.push( material );

					} else if ( ! uploadedModelMaterials.includes( material ) ) {

						uploadedModelMaterials.push( material );

					}

				}

				function standardMaterialToNode( source ) {

					if ( ! source ) return new THREE.MeshStandardNodeMaterial( { color: 0x888888 } );
					if ( source.isMeshStandardNodeMaterial || source.isMeshPhysicalNodeMaterial ) {

						registerUploadedMaterial( source );
						return source;

					}

					if ( ! ( source.isMeshStandardMaterial || source.isMeshPhysicalMaterial ) ) {

						const fallback = new THREE.MeshStandardNodeMaterial( { color: 0xaaaaaa, metalness: 0.5, roughness: 0.5 } );
						source.dispose();
						registerUploadedMaterial( fallback );
						return fallback;

					}

					const m = source.isMeshPhysicalMaterial
						? new THREE.MeshPhysicalNodeMaterial()
						: new THREE.MeshStandardNodeMaterial();
					m.name = source.name;
					m.map = source.map;
					m.lightMap = source.lightMap;
					if ( source.normalMap ) {

						m.normalMap = source.normalMap;
						m.normalScale.copy( source.normalScale );

					}

					m.roughnessMap = source.roughnessMap;
					m.metalnessMap = source.metalnessMap;
					if ( source.aoMap ) {

						m.aoMap = source.aoMap;
						m.aoMapIntensity = source.aoMapIntensity;

					}

					m.emissiveMap = source.emissiveMap;
					m.emissive.copy( source.emissive );
					m.color.copy( source.color );
					m.metalness = source.metalness;
					m.roughness = source.roughness;
					if ( m.isMeshPhysicalNodeMaterial && source.isMeshPhysicalMaterial ) {

						m.clearcoat = source.clearcoat;
						m.clearcoatRoughness = source.clearcoatRoughness;
						m.clearcoatMap = source.clearcoatMap;
						m.transmission = source.transmission;
						m.thickness = source.thickness;
						m.attenuationDistance = source.attenuationDistance;
						if ( source.attenuationColor ) m.attenuationColor.copy( source.attenuationColor );
						m.ior = source.ior;

					}

					m.transparent = source.transparent;
					m.opacity = source.opacity;
					m.alphaMap = source.alphaMap;
					m.side = source.side;
					m.vertexColors = source.vertexColors;
					m.envMap = source.envMap;
					m.envMapIntensity = source.envMapIntensity;
					m.flatShading = source.flatShading;
					m.blending = source.blending;
					m.depthWrite = source.depthWrite;
					m.depthTest = source.depthTest;
					source.dispose();
					registerUploadedMaterial( m );
					return m;

				}

				function applyProbeMaterialsToMesh( mesh ) {

					if ( Array.isArray( mesh.material ) ) {

						mesh.material = mesh.material.map( ( mat ) => standardMaterialToNode( mat ) );

					} else {

						mesh.material = standardMaterialToNode( mesh.material );

					}

				}

				function clearUploadedModel() {

					if ( ! uploadedModel ) return;

					scene.remove( uploadedModel );
					uploadedModel.traverse( ( child ) => {

						if ( child.isMesh ) {

							if ( Array.isArray( child.material ) ) {

								child.material.forEach( ( m ) => m.dispose() );

							} else if ( child.material ) {

								child.material.dispose();

							}

							child.geometry?.dispose();

						}

					} );
					for ( const m of uploadedModelMaterials ) {

						const i = probeMaterials.indexOf( m );
						if ( i >= 0 ) probeMaterials.splice( i, 1 );

					}

					uploadedModelMaterials.length = 0;
					uploadedModel = null;
					transformControls.attach( sphere );
					updateLightsNode();

				}

				const fileInput = document.createElement( 'input' );
				fileInput.type = 'file';
				fileInput.accept = '.glb,.gltf,model/gltf+json,model/gltf-binary';
				fileInput.style.display = 'none';
				document.body.appendChild( fileInput );
				fileInput.addEventListener( 'change', ( event ) => {

					const file = event.target.files[ 0 ];
					event.target.value = '';
					if ( ! file ) return;

					clearUploadedModel();

					const reader = new FileReader();
					reader.addEventListener( 'load', ( e ) => {

						const data = e.target.result;
						gltfLoader.parse(
							data,
							'',
							( gltf ) => {

								const model = gltf.scene;
								model.traverse( ( child ) => {

									if ( child.isMesh ) {

										child.castShadow = true;
										child.receiveShadow = true;
										applyProbeMaterialsToMesh( child );

									}

								} );

								const box = new THREE.Box3().setFromObject( model );
								const size = new THREE.Vector3();
								box.getSize( size );
								const maxDim = Math.max( size.x, size.y, size.z, 0.0001 );
								const targetSize = 2;
								model.scale.setScalar( targetSize / maxDim );
								const box2 = new THREE.Box3().setFromObject( model );
								model.position.set( 0, - box2.min.y, 0 );
								model.position.add( new THREE.Vector3( - 4, 0, 0 ) );

								scene.add( model );
								uploadedModel = model;
								transformControls.detach();
								transformControls.attach( model );
								updateLightsNode();
								bakeWithResolution( params.resolution );

							},
							( err ) => console.error( 'GLTF: failed to load file', err )
						);

					} );
					if ( file.name.toLowerCase().endsWith( '.gltf' ) ) {

						reader.readAsText( file );

					} else {

						reader.readAsArrayBuffer( file );

					}

				} );

				gui = new GUI();
				gui.add( params, 'enabled' ).name( 'GI' ).onChange( () => {

					updateLightsNode();

				} );
				gui.add( params, 'resolution', 2, 8, 1 ).name( 'Resolution' ).onFinishChange( async ( value ) => {

					await bakeWithResolution( value );

				} );
				gui.add( params, 'showProbes' ).name( 'Show Probes' ).onChange( ( value ) => {

					if ( probesHelperLeft ) {

						probesHelperLeft.visible = value;
						probesHelperLeft.update();

					}

					if ( probesHelperRight ) {

						probesHelperRight.visible = value;
						probesHelperRight.update();

					}

					renderer.render( scene, camera );

				} );

				const gltfFolder = gui.addFolder( 'GLTF' );
				gltfFolder.add( { load: () => fileInput.click() }, 'load' ).name( 'Load glTF / GLB' );
				gltfFolder.add( {
					clear: () => {

						clearUploadedModel();
						renderer.render( scene, camera );

					}
				}, 'clear' ).name( 'Remove model' );
				gltfFolder.add( {
					rebake: () => {

						bakeWithResolution( params.resolution );

					}
				}, 'rebake' ).name( 'Rebake GI' );

				await bakeWithResolution( params.resolution );

				window.addEventListener( 'resize', onWindowResize );

			}

			function onWindowResize() {

				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();
				renderer.setSize( window.innerWidth, window.innerHeight );

			}

			function animate() {

				renderer.render( scene, camera );

			}

		</script>
	</body>
</html>
